<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقام والای مادر</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        /* تنظیمات کلی و پس زمینه لوکس */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0a0a 0%, #3a1c1c 100%); /* گرادیانت تیره با ته رنگ زرشکی */
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* افکت نور محیطی (Glow) */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            animation: pulseGlow 8s infinite alternate;
            z-index: -1;
        }

        /* کادر اصلی موبایل */
        .card-container {
            width: 90%;
            max-width: 450px;
            background: rgba(10, 5, 5, 0.7);
            border: 2px solid #FFD700; /* حاشیه طلایی پررنگ */
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);
            position: relative;
            opacity: 0;
            animation: cardAppear 1s ease-out forwards;
        }

        /* انیمیشن ظهور کارت */
        @keyframes cardAppear {
            to { opacity: 1; transform: scale(1); }
            from { opacity: 0; transform: scale(0.9); }
        }

        /* انیمیشن نور محیطی */
        @keyframes pulseGlow {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }

        /* ----- بخش جدید: انیمیشن تغییر رنگ برای کلمه مادر ----- */
        @keyframes rainbow-text {
            0% { color: #FFD700; text-shadow: 0 0 15px #FFD700; }
            20% { color: #ff007f; text-shadow: 0 0 15px #ff007f; } /* صورتی */
            40% { color: #00ffaa; text-shadow: 0 0 15px #00ffaa; } /* فیروزه ای */
            60% { color: #0099ff; text-shadow: 0 0 15px #0099ff; } /* آبی روشن */
            80% { color: #ff5500; text-shadow: 0 0 15px #ff5500; } /* نارنجی */
            100% { color: #FFD700; text-shadow: 0 0 15px #FFD700; } /* طلایی */
        }
        
        /* عنوان اصلی (مادر) با افکت تغییر رنگ */
        .main-title {
            font-size: 3.5em;
            margin: 15px 0 20px;
            font-weight: 900;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeIn 1s 1s forwards, rainbow-text 6s infinite ease-in-out;
        }
        /* ---------------------------------------------------- */

        /* نماد تاج */
        .symbol {
            font-size: 4em;
            color: #FFD700;
            opacity: 0;
            animation: fadeIn 0.8s 0.5s forwards;
        }

        /* انیمیشن fadeIn عمومی */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* متن رسمی و قدردانی */
        .message-container {
            font-size: 1.1em;
            line-height: 2;
            margin-top: 30px;
            color: #ccc;
            font-weight: 300;
            text-align: justify;
            text-align-last: center; /* برای توجیه در وسط */
        }
        
        .message span {
            opacity: 0;
            animation: textFadeIn 0.5s forwards;
            display: inline-block;
        }

        /* انیمیشن ظهور کلمه به کلمه (Staggered Effect) */
        @keyframes textFadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(10px); }
        }

        .highlight-mother {
            color: #ffffff;
            font-weight: 700;
        }

        /* امضا */
        .footer {
            margin-top: 40px;
            font-size: 0.95em;
            color: #999;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 215, 0, 0.2);
            opacity: 0;
            animation: fadeIn 1s 6s forwards; /* آخرین چیزی که ظاهر می شود */
        }

    </style>
</head>
<body>

    <div class="card-container">
        
        <div class="symbol">👑</div>

        <h1 class="main-title">مــــــادر</h1>
        
        <div class="message-container">
            <div class="message">
                <span style="animation-delay: 2s;">تنها</span>
                <span style="animation-delay: 2.1s;">کلمه‌ای</span>
                <span style="animation-delay: 2.2s;">که</span>
                <span style="animation-delay: 2.3s;">عظمتش</span>
                <span style="animation-delay: 2.4s;">در</span>
                <span style="animation-delay: 2.5s;">هیچ</span>
                <span style="animation-delay: 2.6s;">جمله‌ای</span>
                <span style="animation-delay: 2.7s;">نمی‌گنجد.</span>
                <br>
                <span style="animation-delay: 3s;">برای</span>
                <span style="animation-delay: 3.1s;">شما</span>
                <span style="animation-delay: 3.2s;">که</span>
                <span style="animation-delay: 3.3s;">دلیل</span>
                <span style="animation-delay: 3.4s;">تمام</span>
                <span class="highlight-mother" style="animation-delay: 3.7s;">آرامش</span>،
                <span class="highlight-mother" style="animation-delay: 4.1s;">موفقیت</span>
                <span style="animation-delay: 4.3s;">و</span>
                <span class="highlight-mother" style="animation-delay: 4.5s;">لبخندهای</span>
                <span style="animation-delay: 4.7s;">من</span>
                <span style="animation-delay: 4.8s;">هستید.</span>
                <br>
                <span style="animation-delay: 5.2s;">وجودتان،</span>
                <span style="animation-delay: 5.4s;">امن‌ترین</span>
                <span style="animation-delay: 5.6s;">سقف</span>
                <span style="animation-delay: 5.8s;">جهان</span>
                <span style="animation-delay: 6s;">است.</span>
            </div>
        </div>

        <div class="footer">
            روزتان، روز تمام خوبی‌ها مبارک باد.<br>
            (با عشق و قدردانی ابدی)
        </div>
    </div>

</body>
</html>
